<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="description" content="Vilniaus 2027 m. tarybos ir mero rinkimų įrankis: tavo prioritetai ir cituojamos partijų pozicijos. Ne prognozė, ne teisinė konsultacija.">
<title>Vilnius 2027 · ManoMiestas</title>
<style>
:root{
  --ink:#173026;--ink-2:#2b4638;--muted:#5d7165;--muted-2:#7b8c81;
  --paper:#f5f3ea;--card:#fffdf7;--card-2:#fbf8ee;--line:#d9ded0;--line-2:#e8ebdf;
  --green:#1f6b4a;--green-2:#2e8b62;--green-3:#dcefe3;--green-4:#eef7f1;
  --amber:#a66a17;--amber-2:#f4e7c8;--red:#9b3636;--red-2:#f7e2df;
  --blue:#2f5d8a;--blue-2:#e2ecf7;--shadow:0 14px 45px rgba(23,48,38,.08);
  --max:1040px;--radius:18px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);background:var(--paper);font-size:16px;line-height:1.55;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(900px 520px at 8% -8%,rgba(190,219,196,.55),transparent 60%),
    radial-gradient(760px 480px at 100% 0%,rgba(235,215,168,.45),transparent 55%),
    linear-gradient(180deg,#f8f6ee 0%,var(--paper) 38%,#f2f0e6 100%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.24;
  background-image:linear-gradient(rgba(23,48,38,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(23,48,38,.06) 1px,transparent 1px);
  background-size:34px 34px;mask-image:linear-gradient(180deg,#000,transparent 72%);
}
a{color:var(--green);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:#124c34}
button{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #8bd6ad;outline-offset:3px;border-radius:8px}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;line-height:1.13;letter-spacing:-.035em;color:var(--ink);margin:0}
h1{font-size:clamp(36px,5.2vw,62px);font-weight:700}
h2{font-size:clamp(26px,3.2vw,38px);font-weight:700}
h3{font-size:clamp(20px,2.2vw,25px);font-weight:700}
h4{font-size:17px;font-weight:700;letter-spacing:-.02em}
p{margin:0 0 1em;color:var(--ink-2)}
small,.small{font-size:12.5px;line-height:1.45;color:var(--muted)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:10px;background:#fff;padding:10px 14px;border-radius:10px;z-index:100}
.skip:focus{left:10px}
.site-header{position:relative;z-index:5;border-bottom:1px solid rgba(23,48,38,.1);background:rgba(255,253,247,.78);backdrop-filter:blur(12px)}
.header-inner{max-width:var(--max);margin:auto;padding:13px 18px;display:flex;gap:18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-weight:850;letter-spacing:-.04em;font-size:19px}
.brand-mark{width:31px;height:31px;border-radius:10px;background:linear-gradient(145deg,var(--green),#3f9b70);display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-size:17px;box-shadow:0 6px 16px rgba(31,107,74,.24)}
.brand small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:750;line-height:1.2}
.nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.nav a{font-size:12.5px;font-weight:700;text-decoration:none;color:var(--muted);padding:8px 9px;border-radius:9px}
.nav a:hover{background:var(--green-4);color:var(--green)}
.nav a[aria-current="page"]{background:var(--green-4);color:var(--green)}
.wrap{max-width:var(--max);margin:auto;padding:0 18px}
main.wrap{padding-top:34px;padding-bottom:70px;min-height:65vh}
.hero{padding:20px 0 10px;display:grid;gap:24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--green);background:var(--green-4);border:1px solid #c9e2d2;padding:7px 10px;border-radius:999px;width:fit-content}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green-2)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:32px;align-items:end}
.hero p.lead{font-size:clamp(17px,2vw,20px);max-width:640px;color:var(--ink-2);line-height:1.6;margin:0}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:13px;padding:13px 19px;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease;min-height:47px}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 9px 20px rgba(31,107,74,.2)}
.btn-primary:hover{background:#18553b;color:#fff}
.btn-ghost{background:rgba(255,253,247,.7);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#b9cbbd;background:#fff}
.btn-soft{background:var(--green-4);border-color:#cfe4d6;color:var(--green)}
.btn-danger{background:#fff;border-color:#e7c3be;color:var(--red)}
.btn-sm{padding:9px 12px;font-size:12.5px;min-height:38px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.card.flat{box-shadow:none;background:rgba(255,253,247,.72)}
.status-card{background:linear-gradient(160deg,#fffdf7,#f7f2e5);border:1px solid #e3dcc7;border-radius:var(--radius);padding:19px;box-shadow:0 12px 32px rgba(82,63,30,.07)}
.status-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(166,106,23,.13);margin-top:5px;flex:0 0 auto}
.status-card strong{display:block;font-size:14px;letter-spacing:-.01em}
.status-card p{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.status-list{display:grid;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.status-list li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e9e1cf;padding-top:8px;font-size:12px;color:var(--muted)}
.status-list b{color:var(--ink);font-weight:800;text-align:right}
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.feature{border:1px solid var(--line);background:rgba(255,253,247,.72);border-radius:14px;padding:16px}
.feature .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--green-3);color:var(--green);font-size:12px;font-weight:900;margin-bottom:10px}
.feature h3{font-size:15px;letter-spacing:-.02em;margin-bottom:5px}
.feature p{font-size:12.5px;margin:0;color:var(--muted);line-height:1.5}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 0 18px}
.section-head p{max-width:600px;margin:6px 0 0;color:var(--muted);font-size:14px}
.step-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
.step-label{font-size:11px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:var(--green)}
.step-dots{display:flex;gap:6px;align-items:center}
.step-dot{width:8px;height:8px;border-radius:50%;background:#d8dfd3}
.step-dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(31,107,74,.12)}
.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.topic-card{appearance:none;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;cursor:pointer;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease;min-height:152px;display:flex;flex-direction:column;gap:9px}
.topic-card:hover{transform:translateY(-2px);border-color:#b9cdbd;box-shadow:0 12px 24px rgba(23,48,38,.08)}
.topic-card[aria-pressed="true"]{border-color:var(--green);background:linear-gradient(155deg,#f0faf3,#fffdf7);box-shadow:0 0 0 3px rgba(31,107,74,.1),0 12px 24px rgba(23,48,38,.07)}
.topic-icon{width:36px;height:36px;border-radius:11px;background:var(--green-4);display:grid;place-items:center;font-size:18px;border:1px solid #d7e9dc}
.topic-card h3{font-size:17px;margin:0}
.topic-card .q{font-size:12.5px;color:var(--green);font-weight:750;margin:0}
.topic-card .desc{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
.topic-card .check{margin-top:auto;font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.topic-card[aria-pressed="true"] .check{color:var(--green)}
.actionbar{position:sticky;bottom:12px;z-index:4;margin-top:20px;background:rgba(255,253,247,.93);border:1px solid var(--line);border-radius:15px;box-shadow:0 14px 34px rgba(23,48,38,.13);padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;backdrop-filter:blur(12px)}
.actionbar .count{font-size:12.5px;color:var(--muted);font-weight:700}
.actionbar .count b{color:var(--ink)}
.actionbar .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.progress{height:7px;background:#e3e8dc;border-radius:999px;overflow:hidden;margin:8px 0 18px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#55a87b);border-radius:999px;transition:width .25s ease}
.q-card{max-width:820px;margin:auto}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750;line-height:1.2}
.chip.green{background:var(--green-4);border-color:#cfe4d6;color:var(--green)}
.chip.amber{background:#fff8e9;border-color:#ead8b5;color:#845a19}
.chip.red{background:#fff0ee;border-color:#e7c3be;color:var(--red)}
.chip.blue{background:var(--blue-2);border-color:#c7d9ee;color:var(--blue)}
.chip.gray{background:#f3f4ee;border-color:#e1e4d9;color:#5f6d62}
.q-card h2{font-size:clamp(27px,3.8vw,42px);margin:0 0 12px}
.context{font-size:13.5px;color:var(--muted);border-left:3px solid #cfe4d6;padding:2px 0 2px 13px;margin:0 0 20px}
.scale{display:grid;gap:8px;margin:18px 0 8px}
.option{appearance:none;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .14s ease,background .14s ease,box-shadow .14s ease;min-height:50px}
.option:hover{border-color:#afc4b3;background:#fbfdf9}
.option .key{width:26px;height:26px;border-radius:8px;background:#f0f3eb;display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--muted);flex:0 0 auto}
.option .label{font-size:14px;font-weight:700;color:var(--ink-2)}
.option[aria-pressed="true"]{border-color:var(--green);background:linear-gradient(90deg,#edf8f0,#fff);box-shadow:0 0 0 3px rgba(31,107,74,.1)}
.option[aria-pressed="true"] .key{background:var(--green);color:#fff}
.option[aria-pressed="true"] .label{color:var(--green)}
.skip-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.priority-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.priority-card{appearance:none;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .14s ease,background .14s ease,box-shadow .14s ease}
.priority-card[aria-pressed="true"]{border-color:var(--green);background:var(--green-4);box-shadow:0 0 0 3px rgba(31,107,74,.1)}
.priority-card strong{font-size:15px}
.priority-card > span{font-size:12px;color:var(--muted)}
.priority-card .chip{align-self:flex-start;font-size:11px}
.result-head{display:grid;gap:12px;margin-bottom:20px}
.result-head h1{font-size:clamp(31px,4.6vw,52px)}
.result-head p{max-width:720px;margin:0;color:var(--muted);font-size:14.5px}
.result-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px;align-items:start}
.plan-card{background:linear-gradient(155deg,#fffdf7,#f6f1e2);border-color:#ded4bc}
.plan-kicker{font-size:10.5px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.plan-party{display:flex;align-items:center;gap:13px;margin:10px 0 14px;padding:14px;background:#fff;border:1px solid #e4ddca;border-radius:13px}
.party-dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 4px rgba(0,0,0,.04)}
.plan-party .name{font-family:Georgia,serif;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.plan-party .full{font-size:11.5px;color:var(--muted);margin-top:3px}
.plan-score{margin-left:auto;text-align:right}
.plan-score b{display:block;font-size:25px;letter-spacing:-.04em}
.plan-score small{font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.steps{margin:14px 0 0;padding:0;list-style:none;counter-reset:step;display:grid;gap:10px}
.steps li{position:relative;padding-left:35px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:8px;background:var(--green-3);color:var(--green);display:grid;place-items:center;font-size:11px;font-weight:900}
.steps b{color:var(--ink)}
.note-box{background:#fff8e9;border:1px solid #ead8b5;border-radius:13px;padding:13px 14px;margin-top:14px;font-size:12px;color:#6e521e;line-height:1.5}
.note-box strong{color:#573f14}
.note-box ul{margin:7px 0 0;padding-left:17px}
.note-box li{margin:3px 0}
.ranking{display:grid;gap:12px}
.party-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--party,var(--green));border-radius:15px;padding:17px;box-shadow:0 8px 24px rgba(23,48,38,.05)}
.party-card.not-eligible{background:#fafbf5;border-left-color:#c9cec2}
.party-card-head{display:flex;align-items:flex-start;gap:12px}
.rank{width:30px;height:30px;border-radius:10px;background:#f1f3ec;display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--muted);flex:0 0 auto}
.rank.top{background:var(--green);color:#fff}
.party-card h3{font-size:17px;margin:0;letter-spacing:-.02em}
.party-card .full-name{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.score-box{margin-left:auto;text-align:right;flex:0 0 auto}
.score-box b{display:block;font-size:30px;line-height:1;letter-spacing:-.05em}
.score-box small{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 0}
.stat{background:#f7f8f2;border:1px solid #e6e9df;border-radius:10px;padding:9px}
.stat b{display:block;font-size:15px;letter-spacing:-.02em}
.stat span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:2px}
.bar{height:6px;background:#e3e8dc;border-radius:999px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--green-2);border-radius:999px}
.bar.amber span{background:var(--amber)}
.bar.red span{background:var(--red)}
details{border-top:1px solid var(--line-2);margin-top:13px;padding-top:10px}
details>summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--green);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:18px;line-height:1;color:var(--muted)}
details[open]>summary::after{content:"–"}
.detail-body{padding-top:12px}
.topic-table{width:100%;border-collapse:collapse;font-size:12px}
.topic-table th,.topic-table td{text-align:left;padding:7px 6px;border-bottom:1px solid #eceee5;vertical-align:top}
.topic-table th{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850}
.topic-table td:last-child,.topic-table th:last-child{text-align:right}
.evidence-list{display:grid;gap:10px}
.evidence{border:1px solid var(--line-2);border-radius:12px;padding:12px;background:#fff}
.evidence .top{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.evidence blockquote{margin:0 0 8px;padding:0 0 0 11px;border-left:3px solid #cfe4d6;font-family:Georgia,serif;font-size:14px;line-height:1.45;color:var(--ink)}
.evidence .meta{font-size:11px;color:var(--muted);line-height:1.45}
.evidence .meta a{font-weight:750}
.evidence .why{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.empty{border:1px dashed #cdd5c8;border-radius:12px;padding:14px;font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.5)}
.topic-result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}
.topic-result + .topic-result{margin-top:10px}
.topic-result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.topic-result-head h3{font-size:17px}
.topic-row{display:grid;grid-template-columns:96px minmax(0,1fr) 52px;gap:9px;align-items:center;padding:7px 0;border-top:1px solid #eef0e8;font-size:12px}
.topic-row .pname{font-weight:800;display:flex;align-items:center;gap:6px}
.topic-row .bar{margin:0}
.topic-row .num{text-align:right;font-weight:850}
.topic-row .sub{grid-column:2 / 4;font-size:10px;color:var(--muted);margin-top:-4px}
.mini-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.caveat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.caveat{background:rgba(255,253,247,.72);border:1px solid var(--line);border-radius:14px;padding:15px}
.caveat h3{font-size:15px;margin-bottom:5px}
.caveat p{font-size:12.5px;color:var(--muted);margin:0}
.footer{border-top:1px solid rgba(23,48,38,.1);background:rgba(255,253,247,.6);padding:26px 0 34px}
.footer-inner{max-width:var(--max);margin:auto;padding:0 18px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.footer-links{display:flex;gap:12px;flex-wrap:wrap}
.footer a{color:var(--muted);font-weight:700}
.hr{height:1px;background:var(--line);margin:26px 0}
.kicker{font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:0 0 7px}
.list-clean{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.list-clean li{margin:4px 0}
.inline-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tiny{font-size:11px;color:var(--muted)}
.center{text-align:center}
.mt0{margin-top:0}.mt1{margin-top:8px}.mt2{margin-top:14px}.mt3{margin-top:22px}.mb0{margin-bottom:0}
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr;gap:22px;align-items:start}
  .result-grid{grid-template-columns:1fr}
  .topic-grid,.priority-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .feature-grid{grid-template-columns:1fr}
  .caveat-grid{grid-template-columns:1fr}
}
@media (max-width:620px){
  .header-inner{padding:11px 14px;align-items:center;flex-wrap:wrap;gap:3px 10px}
  .nav{flex:1 0 100%;justify-content:flex-start;gap:0 2px;margin-top:1px}
  .nav a{font-size:11.5px;padding:6px 7px}
  .wrap{padding:0 14px}
  main.wrap{padding-top:24px}
  .topic-grid,.priority-grid{grid-template-columns:1fr}
  .topic-card{min-height:auto}

      var minKnown = Math.min(3, answered);

        mayor_candidates: status === 'close' || status === 'clear' ? mayorCandidates : [],
        preference_votes: 5,

        ballot_number: null,
        notes: notes,
        topic_plan: topicPlan,
        top_mayor: top ? partyMayor(top.party_id) : null
      }
    };
  }

  return { scoreV21: scoreV21, STANCE: STANCE, MIN_COVERAGE_PCT: MIN_COVERAGE_PCT };
});

function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }
function append(node, kids){
  const list = Array.isArray(kids) ? kids : [kids];
  list.flat(Infinity).forEach(function(kid){
    if (kid === null || kid === undefined || kid === false) return;
    node.appendChild(kid && kid.nodeType ? kid : document.createTextNode(String(kid)));
  });
}
function h(tag, attrs, ...kids){
  const node = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function(key){
      const value = attrs[key];
      if (value === null || value === undefined || value === false) return;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key === 'style') Object.assign(node.style, value);
      else if (key === 'dataset') Object.assign(node.dataset, value);
      else if (key.slice(0,2) === 'on' && typeof value === 'function') node.addEventListener(key.slice(2).toLowerCase(), value);
      else node.setAttribute(key, value === true ? '' : value);
    });
  }
  append(node, kids);
  return node;
}
function link(href, text, cls, external){
  const a = h('a', {href: href, class: cls || null, text: text});
  if (external) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }

}
function announce(text){ live.textContent = ''; window.setTimeout(function(){ live.textContent = text; }, 20); }
function topicIcon(id){

}
function confidenceLabel(value){
  return ({high:'Aukštas',medium:'Vidutinis',low:'Žemas',none:'—'})[value] || '—';
}
function scoreableStanceSummary(){
  const counts = {};
  let total = 0;
  Object.keys(DATA.answers).forEach(function(pid){
    Object.keys(DATA.answers[pid]).forEach(function(sid){
      const answer = DATA.answers[pid][sid];
      if (answer.scoreable === true && answer.quote_verified === true) {
        total += 1;
        counts[answer.stance] = (counts[answer.stance] || 0) + 1;
      }
    });
  });
  return {total: total, allAgree: total > 0 && counts.agree === total};
}
function statusLabel(status, closeReason){
  if (status === 'clear') return 'Ryškus atitikimas';
  if (status === 'insufficient') return 'Nepakanka duomenų';
  if (status === 'no_match') return 'Nėra aiškaus atitikimo';
  if (closeReason === 'coverage') return 'Plona aprėptis';

}
function statusHelp(status, closeReason){

  if (status === 'insufficient') return 'Trūksta patikimų, cituojamų pozicijų, kad būtų galima pagrįstai išskirti sąrašą.';
  if (status === 'no_match') return 'Geriausias turimas atitikimas nesiekia 50/100. Nerekomenduojame sąrašo; skaityk programas ir kandidatų sąrašus.';
  if (closeReason === 'coverage') return 'Vienas sąrašas turi daugiausia atitikimų, bet jo aprėptis plona. Rinkis atsargiai ir žiūrėk į temas.';
  if (closeReason === 'margin_and_coverage') return 'Keli sąrašai arti pagal atitikimą, o viršutinio sąrašo aprėptis plona. Rinkis pagal temą ir konkrečius kandidatus.';
  return 'Keli sąrašai arti pagal atitikimą. Geriau rinktis pagal tau svarbiausią temą, o ne pagal vieną skaičių.';
}
function selectedQuestions(){

}
function answerCount(){

function screenTopics(app){

function renderPlan(result){
  const plan = result.plan;
  const topParty = result.top ? PARTY.get(result.top) : null;
  let heading, body;
  if (result.status === 'clear' && topParty) {
    heading = 'Labiausiai tinkantis sąrašas';
    body = h('div', {class:'plan-party'},
      h('span', {class:'party-dot', style:{background:topParty.color}}),

  } else if (result.status === 'close') {
    heading = result.shortlist.length === 1 ? 'Artimiausias sąrašas' : 'Artimiausi sąrašai';
    body = h('div', {class:'ranking'}, result.shortlist.map(function(id){
      const party = PARTY.get(id);
      const row = result.parties.find(function(p){ return p.party_id === id; });
      return h('div', {class:'plan-party'},
        h('span', {class:'party-dot', style:{background:party.color}}),
        h('div', {}, h('div', {class:'name', text:party.short_name}), h('div', {class:'full', text:party.name})),

      );

function renderRanking(result){
  const nodes = [];

  nodes.push(h('div', {class:'ranking'}, result.parties.map(function(row){
    const party = PARTY.get(row.party_id);

    const status = row.eligible ? (isTop ? 'Labiausiai atitinka' : 'Pakankama aprėptis') : 'Nepakankama aprėptis';
    const topicRows = result.selected_topics.map(function(tid){

    return h('article', {class:'party-card' + (row.eligible ? '' : ' not-eligible'), style:{borderLeftColor:party.color}},
      h('div', {class:'party-card-head'},
        h('span', {class:'rank' + (isTop ? ' top' : ''), text:row.rank ? String(row.rank) : '—'}),
        h('div', {}, h('h3', {text:party.short_name}), h('p', {class:'full-name', text:party.name})),
        h('div', {class:'score-box'}, h('b', {text:score}), h('small', {text:row.eligible ? 'atitikimas' : 'nepakankama'}))

function renderEvidence(result){
  const qs = selectedQuestions().filter(function(s){ return STATE.answers[s.id] !== undefined && STATE.answers[s.id] !== null; });
  const nodes = [h('div', {class:'section-head'}, h('div', {}, h('h2', {text:'Cituojami šaltiniai'}), h('p', {text:'Kiekviena įskaitoma pozicija turi tikslią citatą ir nuorodą. Neįskaitytos eilutės rodomos su priežastimi – jos nebuvo paslėptos.'})))];
  if (!qs.length) {
    nodes.push(h('div', {class:'empty', text:'Nėra atsakytų klausimų, todėl nėra ką lyginti su šaltiniais.'}));
    return h('div', {}, nodes);
  }
  result.parties.forEach(function(row){
    const party = PARTY.get(row.party_id);
    const evidenceRows = qs.map(function(statement){
      const answer = (DATA.answers[row.party_id] || {})[statement.id] || {};
      if (!answer.quote) {
        return h('div', {class:'evidence'},
          h('div', {class:'top'}, h('span', {class:'chip amber', text:'Nėra pozicijos'}), h('span', {class:'chip gray', text:TOPIC.get(statement.topic_id).name})),
          h('div', {class:'small', text:answer.note || 'Nėra cituojamos 2027 m. pozicijos.'})
        );
      }
      const scored = answer.scoreable === true && answer.quote_verified === true;
      return h('div', {class:'evidence'},
        h('div', {class:'top'},
          h('span', {class:'chip ' + (scored ? 'green' : 'amber'), text:scored ? 'Įskaityta' : 'Neįskaityta'}),
          h('span', {class:'chip gray', text:TOPIC.get(statement.topic_id).name}),
          h('span', {class:'chip blue', text:stanceLabel(answer.stance)})
        ),
        h('blockquote', {text:'„' + answer.quote + '“'}),
        h('div', {class:'meta'},
          (answer.speaker && answer.speaker.name ? answer.speaker.name : '—') + ' · ' + (answer.source_type === 'programme' ? 'programa' : 'pareiškimas') + ' · ' + (answer.source_date || '—') + ' · ',
          link(answer.source_url, 'Šaltinis', null, true)
        ),
        h('div', {class:'why'}, answer.review_note || ''),
        h('div', {class:'tag-row'},
          h('span', {class:'chip ' + (scored ? 'green' : 'gray'), text:scored ? 'Citata patikrinta' : 'Neskaičiuojama'}),
          h('span', {class:'chip gray', text:'AI patikrinta; laukia žmogaus'})
        )
      );
    });
    nodes.push(h('details', {open: row.rank === 1},
      h('summary', {}, h('span', {text:party.short_name + ' · ' + row.known + ' žinomos pozicijos'}), h('span', {class:'tiny', text:'Atidaryti citatas'})),
      h('div', {class:'detail-body'}, h('div', {class:'evidence-list'}, evidenceRows))
    ));
  });
  nodes.push(h('div', {class:'note-box'}, h('strong', {text:'Patikros data: '}), META.source_checked_at || META.generated_at || '—', '. Citatos patikrintos pagal išsaugotus šaltinio tekstus. Tai techninė citatos patikra, ne nepriklausoma teisinė ar politinė peržiūra.', h('div', {class:'inline-links'}, link('sources_2027.html', 'Visi šaltiniai ir patikros', 'btn btn-soft btn-sm'))));
  return h('div', {}, nodes);
}
