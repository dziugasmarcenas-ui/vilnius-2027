<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="description" content="Vilniaus 2027 m. tarybos ir mero rinkimų įrankis: tavo prioritetai ir cituojamos partijų pozicijos. Ne prognozė, ne teisinė konsultacija.">
<title>Vilnius 2027 · ManoMiestas</title>
<style>
:root{
  --ink:#1b2a21;--ink-2:#35463b;--muted:#5f6d63;--muted-2:#78857c;
  --paper:#faf9f4;--card:#fff;--card-2:#fcfbf7;--line:#d7dbd0;--line-2:#e8eae2;
  --green:#1f5c43;--green-2:#2f7355;--green-3:#e3efe7;--green-4:#f1f6f2;
  --amber:#8a5a15;--amber-2:#f3e7cd;--red:#8f3535;--red-2:#f7e4e1;
  --blue:#2f5d8a;--blue-2:#e8eff7;
  --max:1040px;--radius:8px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);background:var(--paper);font-size:16px;line-height:1.55;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  background:var(--paper);
}
a{color:var(--green);text-underline-offset:3px;text-decoration-thickness:1px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;overflow-wrap:anywhere;word-break:break-word}
a:hover{color:#123c2c}
button{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #8fc4a6;outline-offset:3px;border-radius:4px}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;line-height:1.2;letter-spacing:-.02em;color:var(--ink);margin:0}
h1{font-size:clamp(30px,4vw,42px);font-weight:700}
h2{font-size:clamp(21px,2.4vw,28px);font-weight:700}
h3{font-size:clamp(18px,2vw,22px);font-weight:700}
h4{font-size:16px;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 1em;color:var(--ink-2)}
small,.small{font-size:12.5px;line-height:1.45;color:var(--muted)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:10px;background:#fff;padding:10px 14px;border-radius:10px;z-index:100}
.skip:focus{left:10px}
.site-header{position:relative;z-index:5;border-bottom:1px solid var(--line);background:var(--card)}
.header-inner{max-width:var(--max);margin:auto;padding:12px 18px;display:flex;gap:18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:750;letter-spacing:-.02em;font-size:18px}
.brand-mark{width:28px;height:28px;border-radius:4px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.brand small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;line-height:1.2}
.nav{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.nav a{font-size:12.5px;font-weight:650;text-decoration:none;color:var(--muted);padding:8px 9px;border-radius:4px}
.nav a:hover{background:var(--green-4);color:var(--green)}
.nav a[aria-current="page"]{background:var(--green-4);color:var(--green)}
.wrap{max-width:var(--max);margin:auto;padding:0 18px}
main.wrap{padding-top:30px;padding-bottom:66px;min-height:65vh}
.hero{padding:8px 0 6px;display:grid;gap:18px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:30px;align-items:start}
.hero p.lead{font-size:clamp(16px,1.6vw,18px);max-width:640px;color:var(--ink-2);line-height:1.6;margin:0}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:6px;padding:12px 17px;font-weight:650;font-size:14px;text-decoration:none;cursor:pointer;transition:background .16s ease,border-color .16s ease;min-height:46px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#174a36;color:#fff}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#b9c1b3;background:#f6f7f1}
.btn-soft{background:var(--green-4);border-color:#cfe0d6;color:var(--green)}
.btn-danger{background:var(--card);border-color:#e6c6c1;color:var(--red)}
.btn-sm{padding:8px 11px;font-size:12.5px;min-height:36px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.card.flat{background:#fcfbf7}
.status-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.status-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.status-dot{width:8px;height:8px;border-radius:2px;background:var(--amber);margin-top:6px;flex:0 0 auto}
.status-card strong{display:block;font-size:14px;letter-spacing:-.01em}
.status-card p{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.status-list{display:grid;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.status-list li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line-2);padding-top:8px;font-size:12px;color:var(--muted)}
.status-list b{color:var(--ink);font-weight:700;text-align:right}
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.feature{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:15px}
.feature h2{font-size:15px;letter-spacing:-.01em;margin-bottom:5px}
.feature p{font-size:12.5px;margin:0;color:var(--muted);line-height:1.5}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 0 18px}
.section-head p{max-width:600px;margin:6px 0 0;color:var(--muted);font-size:14px}
.step-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
.step-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.topic-card{appearance:none;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;cursor:pointer;transition:border-color .16s ease,background .16s ease;min-height:140px;display:flex;flex-direction:column;gap:8px}
.topic-card:hover{border-color:#a9b8ac}
.topic-card[aria-pressed="true"]{border-color:var(--green);background:var(--green-4)}
.topic-card h3{font-size:17px;margin:0}
.topic-card .q{font-size:12.5px;color:var(--green);font-weight:650;margin:0}
.topic-card .desc{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
.topic-card .check{margin-top:auto;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.topic-card[aria-pressed="true"] .check{color:var(--green)}
.actionbar{position:sticky;bottom:12px;z-index:4;margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.actionbar .count{font-size:12.5px;color:var(--muted);font-weight:700}
.actionbar .count b{color:var(--ink)}
.actionbar .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.progress{height:6px;background:#e3e6dc;border-radius:3px;overflow:hidden;margin:8px 0 18px}
.progress span{display:block;height:100%;background:var(--green-2);transition:width .25s ease}
.q-card{max-width:820px;margin:auto}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:4px;padding:4px 7px;font-size:11px;font-weight:650;line-height:1.2}
.chip.green{background:var(--green-4);border-color:#cfe0d6;color:var(--green)}
.chip.amber{background:#fdf7e9;border-color:#e4d6b6;color:#7a5418}
.chip.red{background:#fcf1ef;border-color:#e6c6c1;color:var(--red)}
.chip.blue{background:var(--blue-2);border-color:#ccdaeb;color:var(--blue)}
.chip.gray{background:#f4f5ef;border-color:#e1e4d8;color:#5f6d62}
.q-card h2{font-size:clamp(23px,3vw,32px);margin:0 0 12px}
.context{font-size:13.5px;color:var(--muted);border-left:3px solid #cfe0d6;padding:2px 0 2px 13px;margin:0 0 20px}
.scale{display:grid;gap:8px;margin:18px 0 8px}
.option{appearance:none;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .14s ease,background .14s ease;min-height:50px}
.option:hover{border-color:#a9b8ac;background:#fbfcf8}
.option .key{width:26px;height:26px;border-radius:4px;background:#f0f2ea;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:0 0 auto}
.option .label{font-size:14px;font-weight:650;color:var(--ink-2)}
.option[aria-pressed="true"]{border-color:var(--green);background:var(--green-4)}
.option[aria-pressed="true"] .key{background:var(--green);color:#fff}
.option[aria-pressed="true"] .label{color:var(--green)}
.skip-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.priority-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.priority-card{appearance:none;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:15px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .14s ease,background .14s ease}
.priority-card[aria-pressed="true"]{border-color:var(--green);background:var(--green-4)}
.priority-card strong{font-size:15px}
.priority-card > span{font-size:12px;color:var(--muted)}
.priority-card .chip{align-self:flex-start;font-size:11px}
.result-head{display:grid;gap:12px;margin-bottom:20px}
.result-head h1{font-size:clamp(27px,3.6vw,38px)}
.result-head p{max-width:720px;margin:0;color:var(--muted);font-size:14.5px}
.result-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px;align-items:start}
.plan-card{background:var(--card);border-color:var(--line)}
.plan-kicker{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.plan-party{display:flex;align-items:center;gap:13px;margin:10px 0 14px;padding:13px;background:#fcfbf7;border:1px solid var(--line-2);border-radius:6px}
.party-dot{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.plan-party .name{font-family:Georgia,serif;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.plan-party .full{font-size:11.5px;color:var(--muted);margin-top:3px}
.plan-score{margin-left:auto;text-align:right}
.plan-score b{display:block;font-size:23px;letter-spacing:-.03em}
.plan-score small{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.steps{margin:14px 0 0;padding:0;list-style:none;counter-reset:step;display:grid;gap:10px}
.steps li{position:relative;padding-left:33px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:23px;height:23px;border-radius:4px;background:var(--green-3);color:var(--green);display:grid;place-items:center;font-size:11px;font-weight:700}
.steps b{color:var(--ink)}
.note-box{background:#fdf7e9;border:1px solid #e4d6b6;border-radius:6px;padding:13px 14px;margin-top:14px;font-size:12px;color:#6b521f;line-height:1.5}
.note-box strong{color:#523d13}
.note-box ul{margin:7px 0 0;padding-left:17px}
.note-box li{margin:3px 0}
.ranking{display:grid;gap:12px}
.party-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--party,var(--green));border-radius:6px;padding:16px}
.party-card.not-eligible{background:#fafbf5;border-left-color:#c9cec2}
.party-card-head{display:flex;align-items:flex-start;gap:12px}
.rank{width:28px;height:28px;border-radius:4px;background:#f1f3ec;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:0 0 auto}
.rank.top{background:var(--green);color:#fff}
.party-card h3{font-size:17px;margin:0;letter-spacing:-.01em}
.party-card .full-name{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.score-box{margin-left:auto;text-align:right;flex:0 0 auto}
.score-box b{display:block;font-size:27px;line-height:1;letter-spacing:-.03em}
.score-box small{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 0}
.stat{background:#f6f7f1;border:1px solid var(--line-2);border-radius:4px;padding:9px}
.stat b{display:block;font-size:15px;letter-spacing:-.01em}
.stat span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.bar{height:6px;background:#e3e6dc;border-radius:3px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--green-2);border-radius:3px}
.bar.amber span{background:var(--amber)}
.bar.red span{background:var(--red)}
details{border-top:1px solid var(--line-2);margin-top:13px;padding-top:10px}
details>summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--green);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:17px;line-height:1;color:var(--muted)}
details[open]>summary::after{content:"–"}
.detail-body{padding-top:12px}
.topic-table{width:100%;border-collapse:collapse;font-size:12px}
.topic-table th,.topic-table td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
.topic-table th{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.topic-table td:last-child,.topic-table th:last-child{text-align:right}
.evidence-list{display:grid;gap:10px}
.evidence{border:1px solid var(--line-2);border-radius:6px;padding:12px;background:var(--card)}
.evidence .top{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.evidence blockquote{margin:0 0 8px;padding:0 0 0 11px;border-left:3px solid #cfe0d6;font-family:Georgia,serif;font-size:14px;line-height:1.5;color:var(--ink)}
.evidence .meta{font-size:11px;color:var(--muted);line-height:1.45}
.evidence .meta a{font-weight:650}
.evidence .why{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.empty{border:1px dashed #cdd5c8;border-radius:6px;padding:14px;font-size:12.5px;color:var(--muted);background:var(--card)}
.topic-result{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:15px}
.topic-result + .topic-result{margin-top:10px}
.topic-result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.topic-result-head h3{font-size:17px}
.topic-row{display:grid;grid-template-columns:96px minmax(0,1fr) 52px;gap:9px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2);font-size:12px}
.topic-row .pname{font-weight:700;display:flex;align-items:center;gap:6px}
.topic-row .bar{margin:0}
.topic-row .num{text-align:right;font-weight:700}
.topic-row .sub{grid-column:2 / 4;font-size:10px;color:var(--muted);margin-top:-4px}
.mini-dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.caveat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.caveat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:15px}
.caveat h3{font-size:15px;margin-bottom:5px}
.caveat p{font-size:12.5px;color:var(--muted);margin:0}
.footer{border-top:1px solid var(--line);background:var(--card);padding:24px 0 32px}
.footer-inner{max-width:var(--max);margin:auto;padding:0 18px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.footer-links{display:flex;gap:12px;flex-wrap:wrap}
.footer a{color:var(--muted);font-weight:700}
.hr{height:1px;background:var(--line);margin:26px 0}
.kicker{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.list-clean{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.list-clean li{margin:4px 0}
.inline-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tiny{font-size:11px;color:var(--muted)}
.center{text-align:center}
.mt0{margin-top:0}.mt1{margin-top:8px}.mt2{margin-top:14px}.mt3{margin-top:22px}.mb0{margin-bottom:0}
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr;gap:22px;align-items:start}
  .result-grid{grid-template-columns:1fr}
  .topic-grid,.priority-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .feature-grid{grid-template-columns:1fr}
  .caveat-grid{grid-template-columns:1fr}
}
@media (max-width:620px){
  .header-inner{padding:11px 14px;align-items:center;flex-wrap:wrap;gap:3px 10px}
  .nav{flex:1 0 100%;justify-content:flex-start;gap:0 2px;margin-top:1px}
  .nav a{font-size:11.5px;padding:6px 7px}
  .wrap{padding:0 14px}
  main.wrap{padding-top:24px}
  .topic-grid,.priority-grid{grid-template-columns:1fr}
  .topic-card{min-height:auto}
  .actionbar{bottom:6px;padding:10px;align-items:flex-start;flex-direction:column}
  .actionbar .actions{width:100%}
  .actionbar .btn{flex:1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .party-card-head{flex-wrap:wrap}
  .score-box{flex:1 0 100%;width:auto;margin-left:0;text-align:left}
  .score-box b{font-size:26px}
  .topic-row{grid-template-columns:82px minmax(0,1fr) 44px}
  .plan-party{align-items:flex-start}
  .plan-score{margin-left:0;text-align:left;flex:1 0 100%}
  .plan-party{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.001ms!important;animation-duration:.001ms!important}
}
@media print{
  .site-header,.actionbar,.btn{display:none!important}
  body{background:#fff}
  .card,.party-card,.plan-card{box-shadow:none;break-inside:avoid}
  main.wrap{max-width:none;padding:0}
  .footer{padding:16px 0 0;background:#fff}
  .footer-links{display:none!important}
}
</style>
</head>

  if (closeReason === 'coverage') return 'Vienas sąrašas turi didžiausią atitikimą, bet jo aprėptis plona. Palygink temas ir šaltinius.';
  if (closeReason === 'margin_and_coverage') return 'Keli sąrašai arti pagal programų atitikimą, o viršutinio sąrašo aprėptis plona. Palygink temas ir konkrečius kandidatus.';
  return 'Keli sąrašai arti pagal programų atitikimą; vieno bendro skaičiaus nepakanka.';
}

function screenTopics(app){
  pageTitle('Temos');
  const cards = [];
  append(app, h('section', {},

      },

        h('button', {class:'btn btn-ghost', type:'button', onclick:function(){ STATE.screen='intro'; render(); }}, 'Atgal'),
        h('button', {class:'btn btn-primary', type:'button', id:'topics-next', disabled:true, onclick:function(){

          STATE.qIndex = 0;
          STATE.screen = 'questions';
          render();
        }}, 'Toliau į klausimus')
      )
    )
  ));

  function update(){
    const count = STATE.selected.length;
    const countEl = document.getElementById('topic-count');
    const next = document.getElementById('topics-next');
    const chip = app.querySelector('.section-head .chip');
    if (countEl) countEl.textContent = String(count);
    if (chip) chip.textContent = count + ' / 3';
    if (next) next.disabled = count === 0;
    cards.forEach(function(card){
      const on = STATE.selected.includes(card.dataset.topic);
      card.setAttribute('aria-pressed', String(on));
      const check = card.querySelector('.check');
      if (check) check.textContent = on ? 'Pasirinkta' : 'Pasirinkti';
    });
  }
  function toggleTopic(id, btn){
    const index = STATE.selected.indexOf(id);
    if (index >= 0) STATE.selected.splice(index, 1);
    else if (STATE.selected.length >= 3) {
      const msg = document.getElementById('topic-message');
      if (msg) msg.textContent = 'Galima pasirinkti daugiausia 3 temas. Atšauk vieną, jei nori kitos.';
      announce('Galima pasirinkti daugiausia tris temas.');
      return;
    } else STATE.selected.push(id);
    update();
    announce('Pasirinkta temų: ' + STATE.selected.length);
  }
  update();
}

function screenQuestions(app){
  const qs = selectedQuestions();
  if (!qs.length) { STATE.screen = 'topics'; render(); return; }
  if (STATE.qIndex >= qs.length) { STATE.screen = 'priority'; render(); return; }
  const q = qs[STATE.qIndex];
  const topic = TOPIC.get(q.topic_id);
  const answer = STATE.answers[q.id];
  const progress = Math.round(((STATE.qIndex + 1) / qs.length) * 100);
  pageTitle(topic.name + ' · Klausimas');
  const options = [];
  append(app, h('section', {class:'q-card'},
    stepTop(2, '2 žingsnis · Klausimai'),
    h('div', {class:'progress', role:'progressbar', 'aria-valuemin':'0', 'aria-valuemax':String(qs.length), 'aria-valuenow':String(STATE.qIndex+1)}, h('span', {style:{width:progress + '%'}})),
    h('div', {class:'q-meta'},
      h('span', {class:'chip green', text:topic.name}),
      h('span', {class:'chip', text:'Klausimas ' + (STATE.qIndex+1) + ' iš ' + qs.length}),
      h('span', {class:'chip gray', text:'Atsakyta ' + answerCount() + ' / ' + qs.length})
    ),
    h('h2', {text:q.text}),
    h('p', {class:'context', text:q.context}),
    h('div', {class:'scale', role:'group', 'aria-label':'Atsakymo skalė'},
      [[2,'Visiškai sutinku'],[1,'Greičiau sutinku'],[0,'Nei taip, nei ne'],[-1,'Greičiau nesutinku'],[-2,'Visiškai nesutinku']].map(function(pair){
        const value = pair[0], label = pair[1];
        const btn = h('button', {class:'option', type:'button', 'aria-pressed':String(answer === value), dataset:{value:String(value)}},
          h('span', {class:'key', text:value > 0 ? '+' + value : String(value)}),
          h('span', {class:'label', text:label})
        );
        btn.addEventListener('click', function(){
          STATE.answers[q.id] = value;
          options.forEach(function(o){ o.setAttribute('aria-pressed', String(Number(o.dataset.value) === value)); });
          const next = document.getElementById('q-next');
          if (next) next.textContent = STATE.qIndex === qs.length - 1 ? 'Baigti klausimus' : 'Toliau';
          announce('Pasirinkta: ' + label);
        });

        return btn;
      })
    ),

      h('span', {class:'small', text:'Atsakymai lieka tik šiame puslapyje. Nieko nesiunčiame.'})
    ),
    h('div', {class:'actionbar'},
      h('div', {class:'count'}, 'Tema: ', h('b', {text:topic.name})),
      h('div', {class:'actions'},
        h('button', {class:'btn btn-ghost', type:'button', onclick:function(){
          if (STATE.qIndex === 0) { STATE.screen='topics'; render(); }
          else { STATE.qIndex -= 1; render(); }
        }}, 'Atgal'),
        h('button', {class:'btn btn-primary', type:'button', id:'q-next', text: STATE.qIndex === qs.length - 1 ? 'Baigti klausimus' : 'Toliau', onclick:function(){
          if (!(q.id in STATE.answers)) STATE.answers[q.id] = null;
          advanceQuestion(qs);
        }})
      )
    )
  ));
}

function advanceQuestion(qs){
  if (STATE.qIndex >= qs.length - 1) {
    if (!STATE.topTopic || !STATE.selected.includes(STATE.topTopic)) STATE.topTopic = STATE.selected[0] || null;
    STATE.screen = 'priority';
    render();
  } else {
    STATE.qIndex += 1;
    render();
  }
}
